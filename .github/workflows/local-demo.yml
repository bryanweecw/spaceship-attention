name: Build local attention demo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: DOWNLOAD_MODEL=0 bash scripts/setup-local.sh
      - run: git diff --check
